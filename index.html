<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador Kegel Personal</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #4ecdc4;
            --danger: #e74c3c;
            --danger-dark: #c0392b;
            --light: #f0f4f8;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            padding: 20px;
            box-sizing: border-box;
        }

        .main-wrapper {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 900px;
        }

        .container, .calendar-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
            flex-grow: 1;
            max-width: 400px;
        }

        /* --- Estilos del Entrenador --- */
        h1, h2, h3 { color: var(--primary); margin-bottom: 20px; margin-top: 0; }
        
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 100%;
            margin-bottom: 20px;
            background: white;
        }

        .visual-cue {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #e0e0e0;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            transition: all 0.5s ease;
        }

        .contracting {
            background-color: #ff6b6b;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.6);
        }

        .relaxing {
            background-color: var(--secondary);
            color: white;
            transform: scale(1.0);
        }

        .status-text { font-size: 24px; font-weight: bold; margin-bottom: 10px; min-height: 30px; }
        .sub-text { color: #7f8c8d; margin-bottom: 20px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            width: 100%;
            margin-bottom: 10px;
        }

        button:hover { background-color: #34495e; }
        button:active { transform: scale(0.98); }
        
        .stop-btn { background-color: var(--danger); display: none; }
        .stop-btn:hover { background-color: var(--danger-dark); }

        .delete-btn {
            background-color: var(--danger);
            margin-top: 20px;
            font-size: 14px;
            padding: 10px 20px;
        }
        .delete-btn:hover { background-color: var(--danger-dark); }

        /* --- Estilos del Calendario --- */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--primary);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .calendar-day-name { font-size: 12px; color: #7f8c8d; margin-bottom: 5px; }

        .calendar-day {
            padding: 8px 0;
            border-radius: 5px;
            font-size: 14px;
            background-color: #f9f9f9;
            position: relative;
        }

        .calendar-day.today { border: 2px solid var(--primary); font-weight: bold;}
        
        .calendar-day.completed {
            background-color: var(--secondary);
            color: white;
            cursor: pointer;
        }
        
        .calendar-day.completed:hover { opacity: 0.8; }
        .calendar-day.empty { background: none; }

        /* Indicador de múltiples sesiones (puntito) */
        .dot {
            height: 4px;
            width: 4px;
            background-color: white;
            border-radius: 50%;
            display: inline-block;
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        .stats {
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        /* --- Gráfica SVG --- */
        .chart-container {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        .chart-svg {
            width: 100%;
            height: 150px;
            background-color: #fdfdfd;
            border-radius: 10px;
        }
        
        .bar { fill: var(--secondary); rx: 4; transition: height 0.5s ease; }
        .bar:hover { fill: var(--primary); }
        .bar-text { font-size: 10px; fill: #7f8c8d; text-anchor: middle; }

        /* --- Popup Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 350px;
            text-align: left;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
            line-height: 1;
        }
        .close-modal:hover { color: #333; }

        .session-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
        }
        .session-item:last-child { border-bottom: none; }
        .level-badge {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
            background: #eee;
            color: #555;
        }

    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="container">
            <h1>Entrenador Kegel</h1>
            
            <label for="level-select">Selecciona tu nivel:</label>
            <select id="level-select">
                <option value="beginner">Principiante (3s / 5s - 5 reps)</option>
                <option value="intermediate">Intermedio (5s / 5s - 10 reps)</option>
                <option value="expert">Experto (10s / 10s - 15 reps)</option>
            </select>

            <div id="visual-circle" class="visual-cue">0</div>

            <div id="status-display" class="status-text">Listo</div>
            <div id="rep-display" class="sub-text">Repeticiones: 0 / 0</div>

            <button id="start-btn" onclick="startWorkout()">Comenzar</button>
            <button id="stop-btn" class="stop-btn" onclick="stopWorkout()">Detener</button>
        </div>

        <div class="calendar-container">
            <h2>Mi Progreso</h2>
            <div class="calendar-header">
                <span id="month-year"></span>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-day-name">Lu</div>
                <div class="calendar-day-name">Ma</div>
                <div class="calendar-day-name">Mi</div>
                <div class="calendar-day-name">Ju</div>
                <div class="calendar-day-name">Vi</div>
                <div class="calendar-day-name">Sa</div>
                <div class="calendar-day-name">Do</div>
            </div>

            <div id="calendar-days" class="calendar-grid">
                </div>

            <div class="stats">
                Sesiones totales: <span id="total-sessions">0</span>
            </div>

            <div class="chart-container">
                <h3>Últimos 14 días</h3>
                <svg id="activity-chart" class="chart-svg" viewBox="0 0 300 150">
                    </svg>
            </div>

            <button class="delete-btn" onclick="clearData()">Borrar Historial</button>
        </div>
    </div>

    <div id="day-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModalButton()">×</span>
            <h3 id="modal-date">Fecha</h3>
            <div id="modal-sessions">
                </div>
        </div>
    </div>

    <script>
        // --- LOGICA DE EJERCICIOS ---
        const levels = {
            beginner: { name: "Principiante", contract: 3, relax: 5, reps: 5 },
            intermediate: { name: "Intermedio", contract: 5, relax: 5, reps: 10 },
            expert: { name: "Experto", contract: 10, relax: 10, reps: 15 }
        };

        let interval;
        let isRunning = false;
        let audioCtx;

        function playTone(freq, type = 'sine', duration = 0.2) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function startWorkout() {
            if (isRunning) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const levelKey = document.getElementById('level-select').value;
            const config = levels[levelKey];
            let currentRep = 1;
            let phase = 'prepare';
            let timeLeft = 3;

            isRunning = true;
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'inline-block';
            document.getElementById('level-select').disabled = true;

            updateUI('Prepárate', timeLeft, currentRep, config.reps, '');

            interval = setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    if (phase === 'prepare' || phase === 'relax') {
                        if (currentRep > config.reps) {
                            finishWorkout(levelKey);
                            return;
                        }
                        phase = 'contract';
                        timeLeft = config.contract;
                        playTone(600, 'sine', 0.5);
                        updateUI('¡APRIETA!', timeLeft, currentRep, config.reps, 'contracting');
                    } else if (phase === 'contract') {
                        phase = 'relax';
                        timeLeft = config.relax;
                        currentRep++;
                        playTone(300, 'sine', 0.5);
                        updateUI('Relaja...', timeLeft, Math.min(currentRep, config.reps), config.reps, 'relaxing');
                    }
                } else {
                    let visualClass = phase === 'contract' ? 'contracting' : (phase === 'relax' ? 'relaxing' : '');
                    updateUI(
                        phase === 'contract' ? '¡APRIETA!' : (phase === 'relax' ? 'Relaja...' : 'Prepárate'), 
                        timeLeft, 
                        (phase === 'relax' && timeLeft === config.relax) ? currentRep -1 : currentRep, 
                        config.reps, 
                        visualClass
                    );
                }
            }, 1000);
        }

        function updateUI(status, time, rep, totalReps, visualClass) {
            document.getElementById('status-display').innerText = status;
            document.getElementById('visual-circle').innerText = time;
            document.getElementById('rep-display').innerText = `Repetición: ${Math.min(rep, totalReps)} / ${totalReps}`;
            document.getElementById('visual-circle').className = 'visual-cue ' + visualClass;
        }

        function stopWorkout() {
            clearInterval(interval);
            isRunning = false;
            resetUI();
        }

        function finishWorkout(levelKey) {
            stopWorkout();
            playTone(800, 'triangle', 0.1);
            setTimeout(() => playTone(800, 'triangle', 0.1), 150);
            playTone(1200, 'triangle', 0.4);
            document.getElementById('status-display').innerText = "¡Entrenamiento Completado!";
            document.getElementById('visual-circle').innerText = "✔";
            saveSession(levelKey);
        }

        function resetUI() {
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('stop-btn').style.display = 'none';
            document.getElementById('level-select').disabled = false;
            document.getElementById('status-display').innerText = "Listo";
            document.getElementById('visual-circle').innerText = "0";
            document.getElementById('visual-circle').className = 'visual-cue';
            document.getElementById('rep-display').innerText = "Repeticiones: 0 / 0";
        }

        // --- HISTORIAL Y DATOS ---
        function getHistory() {
            const data = localStorage.getItem('kegelHistory');
            return data ? JSON.parse(data) : {};
        }

        function saveSession(level) {
            const history = getHistory();
            const today = new Date();
            // Ajustar a local YYYY-MM-DD
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];

            if (!history[localISOTime]) history[localISOTime] = [];
            
            // Guardamos el nivel y la hora exacta
            const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            history[localISOTime].push({ level: level, time: timeStr });
            
            localStorage.setItem('kegelHistory', JSON.stringify(history));
            renderCalendar();
            renderChart();
        }

        // --- CALENDARIO ---
        function renderCalendar() {
            const date = new Date();
            const year = date.getFullYear();
            const month = date.getMonth();
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            
            document.getElementById('month-year').innerText = `${monthNames[month]} ${year}`;
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';
            const history = getHistory();
            
            // Calcular stats
            let total = 0;
            Object.values(history).forEach(dayArr => total += dayArr.length);
            document.getElementById('total-sessions').innerText = total;

            // Logica dias
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startOffset = firstDay === 0 ? 6 : firstDay - 1;

            // Espacios vacios
            for (let i = 0; i < startOffset; i++) {
                daysContainer.appendChild(Object.assign(document.createElement('div'), {className: 'calendar-day empty'}));
            }

            // Dias reales
            const todayStr = (new Date(new Date() - (new Date().getTimezoneOffset() * 60000))).toISOString().split('T')[0];

            for (let day = 1; day <= daysInMonth; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                dayDiv.innerText = day;

                const currentD = new Date(year, month, day);
                const checkDate = (new Date(currentD - (currentD.getTimezoneOffset() * 60000))).toISOString().split('T')[0];

                if (checkDate === todayStr) dayDiv.classList.add('today');

                if (history[checkDate]) {
                    dayDiv.classList.add('completed');
                    dayDiv.onclick = () => openModal(checkDate, history[checkDate]);
                    
                    // Si hay mas de 1 sesion, mostrar puntito
                    if(history[checkDate].length > 1) {
                         const dot = document.createElement('span');
                         dot.className = 'dot';
                         dayDiv.appendChild(dot);
                    }
                }

                daysContainer.appendChild(dayDiv);
            }
        }

        // --- MODAL POPUP ---
        function openModal(dateStr, sessions) {
            const modal = document.getElementById('day-modal');
            const list = document.getElementById('modal-sessions');
            document.getElementById('modal-date').innerText = "Sesiones del " + dateStr;
            list.innerHTML = '';

            // Si los datos son antiguos (solo strings) o nuevos (objetos), normalizamos
            sessions.forEach((s, index) => {
                const item = document.createElement('div');
                item.className = 'session-item';
                
                // Compatibilidad con datos antiguos si los hubiera
                let levelCode = typeof s === 'string' ? s : s.level;
                let timeStr = typeof s === 'object' && s.time ? s.time : `Sesión ${index + 1}`;
                let levelName = levels[levelCode] ? levels[levelCode].name : levelCode;

                item.innerHTML = `<span>${timeStr}</span> <span class="level-badge">${levelName}</span>`;
                list.appendChild(item);
            });

            modal.style.display = 'flex';
        }

        function closeModal(e) {
            if (e.target.id === 'day-modal') document.getElementById('day-modal').style.display = 'none';
        }
        function closeModalButton() {
             document.getElementById('day-modal').style.display = 'none';
        }

        // --- GRAFICA SVG ---
        function renderChart() {
            const svg = document.getElementById('activity-chart');
            svg.innerHTML = ''; // Limpiar
            const history = getHistory();
            const daysToShow = 14;
            const barWidth = 15;
            const spacing = 5;
            const chartHeight = 120; // Espacio vertical para barras
            const maxBarHeight = 100;

            // Obtener ultimos 14 dias
            const data = [];
            for (let i = daysToShow - 1; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = (new Date(d - (d.getTimezoneOffset() * 60000))).toISOString().split('T')[0];
                const count = history[dateStr] ? history[dateStr].length : 0;
                // Dia del mes para etiqueta
                data.push({ label: d.getDate(), count: count });
            }

            // Encontrar maximo para escalar
            const maxSessions = Math.max(...data.map(d => d.count), 1); // Minimo 1 para evitar division por 0

            // Dibujar barras
            const startX = (300 - (daysToShow * (barWidth + spacing))) / 2; // Centrar grafica

            data.forEach((d, i) => {
                const height = (d.count / maxSessions) * maxBarHeight;
                const x = startX + (i * (barWidth + spacing));
                const y = chartHeight - height + 10; // +10 margen superior

                // Barra (Rectangulo)
                if (d.count > 0) {
                    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    rect.setAttribute("x", x);
                    rect.setAttribute("y", y);
                    rect.setAttribute("width", barWidth);
                    rect.setAttribute("height", height);
                    rect.setAttribute("class", "bar");
                    // Tooltip nativo SVG
                    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
                    title.textContent = `${d.count} sesiones`;
                    rect.appendChild(title);
                    svg.appendChild(rect);
                }

                // Texto (Dia)
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", x + barWidth/2);
                text.setAttribute("y", 145); // Abajo del todo
                text.setAttribute("class", "bar-text");
                text.textContent = d.label;
                svg.appendChild(text);
            });
            
            // Linea base
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", startX);
            line.setAttribute("y1", chartHeight + 10);
            line.setAttribute("x2", startX + (daysToShow * (barWidth + spacing)) - spacing);
            line.setAttribute("y2", chartHeight + 10);
            line.setAttribute("stroke", "#eee");
            line.setAttribute("stroke-width", "1");
            svg.appendChild(line);
        }

        function clearData() {
            if(confirm("¿Seguro que quieres borrar TODO el historial? Esta acción no se puede deshacer.")) {
                localStorage.removeItem('kegelHistory');
                renderCalendar();
                renderChart();
            }
        }

        // Inicializar
        renderCalendar();
        renderChart();

    </script>
</body>
</html>
